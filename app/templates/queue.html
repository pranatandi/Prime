{% extends "base.html" %}

{% block title %}Operator Queue{% endblock %}

{% block content %}
<div class="card">
    <h2>📋 Operator Queue</h2>
    <p>Manage weighing transactions and workflow.</p>
    
    <div style="margin-top: 20px;">
        <button onclick="loadQueue()" class="btn btn-primary">🔄 Refresh</button>
        <button onclick="filterByStatus('waiting_gross')" class="btn btn-primary">Waiting Gross</button>
        <button onclick="filterByStatus('sorting')" class="btn btn-warning">Sorting</button>
        <button onclick="filterByStatus('waiting_tare')" class="btn btn-warning">Waiting Tare</button>
        <button onclick="filterByStatus('completed')" class="btn btn-success">Completed</button>
        <button onclick="loadQueue()" class="btn btn-primary">All</button>
    </div>
</div>

<div id="queueList"></div>
{% endblock %}

{% block extra_js %}
<script>
let currentFilter = null;

async function loadQueue(status = null) {
    currentFilter = status;
    
    try {
        let url = '/api/transactions';
        if (status) {
            url += '?status=' + status;
        }
        
        const response = await fetch(url);
        const transactions = await response.json();
        
        const queueList = document.getElementById('queueList');
        
        if (transactions.length === 0) {
            queueList.innerHTML = '<div class="card"><p>No transactions found.</p></div>';
            return;
        }
        
        let html = '';
        
        transactions.forEach(txn => {
            html += `
                <div class="card" style="margin-top: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: start;">
                        <div>
                            <h3>Transaction #${txn.id}</h3>
                            <p><strong>DO Number:</strong> ${txn.do_number}</p>
                            <p><strong>Status:</strong> <span class="status-badge status-${txn.status}">${txn.status}</span></p>
                            <p><strong>Created:</strong> ${formatDateTime(txn.created_at)}</p>
                        </div>
                        <div style="text-align: right;">
                            ${getActionButtons(txn)}
                        </div>
                    </div>
                    
                    ${getWeightInfo(txn)}
                </div>
            `;
        });
        
        queueList.innerHTML = html;
        
    } catch (error) {
        document.getElementById('queueList').innerHTML = `
            <div class="alert alert-error">Error loading queue: ${error.message}</div>
        `;
    }
}

function getActionButtons(txn) {
    let buttons = '';
    
    if (txn.status === 'waiting_gross') {
        buttons = `<button onclick="recordGrossWeight(${txn.id})" class="btn btn-success">⚖️ Record Gross Weight</button>`;
    } else if (txn.status === 'sorting') {
        buttons = `
            <a href="/sorting/${txn.id}" class="btn btn-warning" style="text-decoration: none;">✂️ Sorting</a>
        `;
    } else if (txn.status === 'waiting_tare') {
        buttons = `<button onclick="recordTareWeight(${txn.id})" class="btn btn-success">⚖️ Record Tare Weight</button>`;
    } else if (txn.status === 'completed') {
        buttons = `<a href="/slip/${txn.id}" class="btn btn-primary" style="text-decoration: none;">🧾 View Slip</a>`;
    }
    
    return buttons;
}

function getWeightInfo(txn) {
    let html = '<div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #ddd;"><table style="margin: 0;"><tbody>';
    
    if (txn.gross_weight) {
        html += `<tr><td><strong>Gross Weight (Bruto):</strong></td><td>${formatNumber(txn.gross_weight)} kg</td><td><small>${formatDateTime(txn.gross_time)}</small></td></tr>`;
    }
    
    if (txn.total_deduction > 0) {
        html += `<tr><td><strong>Deductions (Potongan):</strong></td><td>${formatNumber(txn.total_deduction)} kg</td><td></td></tr>`;
    }
    
    if (txn.tare_weight) {
        html += `<tr><td><strong>Tare Weight (Tarra):</strong></td><td>${formatNumber(txn.tare_weight)} kg</td><td><small>${formatDateTime(txn.tare_time)}</small></td></tr>`;
    }
    
    if (txn.net_weight) {
        html += `<tr><td><strong>Net Weight (Netto):</strong></td><td><strong>${formatNumber(txn.net_weight)} kg</strong></td><td></td></tr>`;
    }
    
    if (txn.net_after_deduction != null) {
        html += `<tr><td><strong>Final Weight (Netto Akhir):</strong></td><td><strong style="color: #27ae60; font-size: 18px;">${formatNumber(txn.net_after_deduction)} kg</strong></td><td></td></tr>`;
    }
    
    html += '</tbody></table></div>';
    
    return html;
}

async function recordGrossWeight(transactionId) {
    if (!confirm('Record gross weight from scale?')) return;
    
    try {
        const operator = prompt('Enter operator name:', 'Operator');
        if (!operator) return;
        
        const response = await fetch(`/api/transactions/${transactionId}/gross-weight`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ operator })
        });
        
        const result = await response.json();
        
        if (response.ok) {
            showAlert(`✅ Gross weight recorded: ${result.weight.toFixed(2)} kg`, 'success');
            loadQueue(currentFilter);
        } else {
            showAlert('Error: ' + result.error, 'error');
        }
        
    } catch (error) {
        showAlert('Error: ' + error.message, 'error');
    }
}

async function recordTareWeight(transactionId) {
    if (!confirm('Record tare weight from scale?')) return;
    
    try {
        const operator = prompt('Enter operator name:', 'Operator');
        if (!operator) return;
        
        const response = await fetch(`/api/transactions/${transactionId}/tare-weight`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ operator })
        });
        
        const result = await response.json();
        
        if (response.ok) {
            showAlert(`✅ Transaction completed! Net weight: ${result.net_weight.toFixed(2)} kg, Final: ${result.net_after_deduction.toFixed(2)} kg`, 'success');
            loadQueue(currentFilter);
        } else {
            showAlert('Error: ' + result.error, 'error');
        }
        
    } catch (error) {
        showAlert('Error: ' + error.message, 'error');
    }
}

function filterByStatus(status) {
    loadQueue(status);
}

// Load queue on page load
loadQueue();

// Auto-refresh every 30 seconds
setInterval(() => loadQueue(currentFilter), 30000);
</script>
{% endblock %}
