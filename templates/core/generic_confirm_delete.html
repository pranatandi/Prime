{% extends "base.html" %}
{% block title %}Hapus {{ title }}{% endblock %}
{% block content %}
<h3 class="mb-3"><i class="bi bi-trash me-2 text-muted"></i>Hapus {{ title }}</h3>
<div class="card" style="max-width: 560px;">
  <div class="card-body">
    <div class="d-flex align-items-start gap-3 mb-3">
      <div class="stat-icon" style="background-color:#fef2f2; color:#dc3545;"><i class="bi bi-exclamation-triangle-fill"></i></div>
      <div>
        <p class="mb-0">Yakin ingin menghapus <strong>{{ object }}</strong>?</p>
        <p class="text-muted small mb-0">Tindakan ini tidak dapat dibatalkan.</p>
      </div>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i>Ya, Hapus</button>
        <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Batal</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
