{% extends "base.html" %}
{% block title %}Hapus {{ title }}{% endblock %}
{% block content %}
<h3 class="mb-3">Hapus {{ title }}</h3>
<div class="card shadow-sm">
  <div class="card-body">
    <p>Yakin ingin menghapus <strong>{{ object }}</strong>? Tindakan ini tidak dapat dibatalkan.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Ya, Hapus</button>
      <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Batal</a>
    </form>
  </div>
</div>
{% endblock %}
